<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21262d"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="26" y="26" width="460" height="460" rx="96" fill="#0e1116"/>
  <rect x="26" y="26" width="460" height="460" rx="96" fill="none"
        stroke="#2a7a6a" stroke-width="6"/>

  <!-- Window frame -->
  <rect x="96" y="128" width="320" height="256" rx="18" fill="url(#frame)"
        stroke="#4ec9b0" stroke-width="5"/>

  <!-- Title bar -->
  <path d="M96 146a18 18 0 0 1 18-18h284a18 18 0 0 1 18 18v26H96z" fill="#161b22"/>
  <circle cx="122" cy="159" r="6" fill="#4ec9b0"/>
  <circle cx="144" cy="159" r="6" fill="#6b7482"/>
  <circle cx="166" cy="159" r="6" fill="#6b7482"/>

  <!-- Directory tree -->
  <g transform="translate(126 196)">
    
    <rect x="0" y="0" width="14" height="11" rx="2" fill="#4ec9b0"/>
    <rect x="20" y="2" width="150" height="7" rx="3.5" fill="#6b7482"/>
    
    <rect x="24" y="30" width="14" height="11" rx="2" fill="#e6e6e6"/>
    <rect x="44" y="32" width="118" height="7" rx="3.5" fill="#6b7482"/>
    
    <rect x="24" y="60" width="14" height="11" rx="2" fill="#e6e6e6"/>
    <rect x="44" y="62" width="132" height="7" rx="3.5" fill="#6b7482"/>
    
    <rect x="48" y="90" width="14" height="11" rx="2" fill="#6b7482"/>
    <rect x="68" y="92" width="96" height="7" rx="3.5" fill="#6b7482"/>
  </g>

  <!-- Key on the frame: this is identity, not file management -->
  <g transform="translate(330 300)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#d7ba7d" stroke-width="10"/>
    <rect x="22" y="-5" width="58" height="10" rx="5" fill="#d7ba7d"/>
    <rect x="62" y="-5" width="10" height="24" rx="5" fill="#d7ba7d"/>
  </g>
</svg>